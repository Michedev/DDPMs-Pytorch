_target_: model.d3pm.D3PM
denoiser_module:
  _target_: model.unet.UNetTimeStep
  channels: [3, 128, 256, 256, 384]
  kernel_sizes: [3, 3, 3, 3]
  strides: [1, 1, 1, 1]
  paddings: [1, 1, 1, 1]
  p_dropouts: [0.1, 0.1, 0.1, 0.1]
  time_embed_size: 100  #did not found this hp on the paper
  downsample: true
  double_output: false
T: ${noise_steps}
width: ${dataset.width}
height: ${dataset.height}
input_channels: ${dataset.channels}
num_classes: 2
vlb: true
lambda_variational: 0.001
init_step_vlb: 1000
logging_freq: 100